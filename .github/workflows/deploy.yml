name: Deploy (Test / Production)

on:
  push:
    branches:
      - test
      - hotfix
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - production
  repository_dispatch:
    types: [codepush-hotfix, codepush-staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '17'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Decide which flavor to build based on trigger
  # ─────────────────────────────────────────────────────────────────────────────
  resolve-flavor:
    name: Resolve Flavor
    runs-on: ubuntu-latest
    outputs:
      flavor: ${{ steps.resolve.outputs.flavor }}
      flavor_label: ${{ steps.resolve.outputs.flavor_label }}

    steps:
      - name: Resolve environment
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FLAVOR="${{ github.event.inputs.environment }}"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            if [ "${{ github.event.action }}" = "codepush-hotfix" ]; then
              FLAVOR="production"
            elif [ "${{ github.event.action }}" = "codepush-staging" ]; then
              FLAVOR="test"
            else
              echo "❌ Unknown repository_dispatch action: ${{ github.event.action }}"
              exit 1
            fi
          elif [[ "${{ github.ref }}" == "refs/heads/test" ]]; then
            FLAVOR="test"
          elif [[ "${{ github.ref }}" == "refs/heads/hotfix" ]]; then
            FLAVOR="production"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            FLAVOR="production"
          else
            echo "❌ Unknown branch/tag — cannot resolve flavor"
            exit 1
          fi

          if [ "$FLAVOR" = "test" ]; then
            echo "flavor=test" >> $GITHUB_OUTPUT
            echo "flavor_label=Test" >> $GITHUB_OUTPUT
          else
            echo "flavor=production" >> $GITHUB_OUTPUT
            echo "flavor_label=Production" >> $GITHUB_OUTPUT
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Pre-flight validation gate — fast checks on ubuntu (free) before macOS builds
  # ─────────────────────────────────────────────────────────────────────────────
  validate-env:
    name: Validate Environment
    needs: [resolve-flavor]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      reanimated_version: ${{ steps.extract.outputs.reanimated_version }}
      worklets_version: ${{ steps.extract.outputs.worklets_version }}

    steps:
      - uses: actions/checkout@v4

      - name: Check lockfiles for merge conflicts
        run: |
          FAILED=false
          for f in yarn.lock ios/Podfile.lock; do
            if [ -f "$f" ] && grep -q -E '<<<<<<< |=======|>>>>>>> ' "$f" 2>/dev/null; then
              echo "::error::Merge conflict detected in $f — resolve before building"
              FAILED=true
            fi
          done
          if [ "$FAILED" = "true" ]; then exit 1; fi
          echo "::notice::Lockfiles are clean (no merge conflicts)"

      - name: Extract critical package versions from yarn.lock
        id: extract
        run: |
          REANIMATED=$(grep -A 2 'react-native-reanimated@npm:' yarn.lock | grep ' version:' | awk '{print $2}')
          WORKLETS=$(grep -A 2 'react-native-worklets@npm:' yarn.lock | grep ' version:' | awk '{print $2}')
          echo "📋 Expected versions from yarn.lock:"
          echo "  react-native-reanimated: $REANIMATED"
          echo "  react-native-worklets:   $WORKLETS"
          if [ -z "$REANIMATED" ] || [ -z "$WORKLETS" ]; then
            echo "::error::Failed to extract critical package versions from yarn.lock"
            exit 1
          fi
          echo "reanimated_version=$REANIMATED" >> $GITHUB_OUTPUT
          echo "worklets_version=$WORKLETS" >> $GITHUB_OUTPUT

      - name: Validate required secrets exist
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          MISSING=false
          for secret in APP_STORE_CONNECT_KEY_ID MATCH_PASSWORD APPLE_ID TEAM_ID; do
            if [ -z "${!secret}" ]; then
              echo "::error::Missing required secret: $secret"
              MISSING=true
            fi
          done
          if [ "$MISSING" = "true" ]; then exit 1; fi
          echo "::notice::All required secrets are configured"

  # ─────────────────────────────────────────────────────────────────────────────
  # Build Android
  # ─────────────────────────────────────────────────────────────────────────────
  build-android:
    name: Build Android (${{ needs.resolve-flavor.outputs.flavor_label }})
    needs: [resolve-flavor]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ needs.resolve-flavor.outputs.flavor }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack (Yarn Berry)
        run: |
          corepack enable
          echo "Yarn version: $(yarn --version)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install dependencies
        run: yarn install --immutable --ignore-scripts

      - name: Apply patches
        run: npx patch-package

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release-upload-key.keystore

      - name: Build Android (${{ needs.resolve-flavor.outputs.flavor_label }})
        run: |
          # Gradle signing properties are passed from GitHub Secrets via -P flags.
          # Set these in Settings → Secrets and variables → Actions:
          #   KEYSTORE_FILE, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
          # Also upload your .keystore file as a base64 secret or make it
          # available via the runner's filesystem (e.g. GitHub Actions cache).
          if [ "${{ needs.resolve-flavor.outputs.flavor }}" = "test" ]; then
            cd android && ./gradlew assembleStagingRelease --no-daemon \
              -PreactNativeArchitectures=arm64-v8a \
              -PKEYSTORE_FILE=${{ secrets.KEYSTORE_FILE }} \
              -PKEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} \
              -PKEY_ALIAS=${{ secrets.KEY_ALIAS }} \
              -PKEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          else
            cd android && ./gradlew bundleProductionRelease --no-daemon \
              -PreactNativeArchitectures=arm64-v8a \
              -PKEYSTORE_FILE=${{ secrets.KEYSTORE_FILE }} \
              -PKEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} \
              -PKEY_ALIAS=${{ secrets.KEY_ALIAS }} \
              -PKEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          fi

      - name: Upload APK/AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ needs.resolve-flavor.outputs.flavor }}
          path: |
            android/app/build/outputs/apk/staging/release/app-staging-release.apk
            android/app/build/outputs/bundle/productionRelease/app-production-release.aab
          retention-days: 30

      - name: 🔑 Write & validate Google Play service account key
        if: ${{ needs.resolve-flavor.outputs.flavor == 'production' }}
        env:
          PLAY_SA_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_KEY }}
        run: |
          # Validate secret is not empty
          if [ -z "${PLAY_SA_KEY}" ]; then
            echo "❌ ERROR: PLAY_SERVICE_ACCOUNT_KEY is empty or not configured."
            echo ""
            echo "   This secret must be set in GitHub repository secrets:"
            echo "   Settings → Secrets and variables → Actions → Repository secrets"
            echo "   Secret name: PLAY_SERVICE_ACCOUNT_KEY"
            echo "   Value: the full JSON content of your Google Play service account key"
            exit 1
          fi

          # Write the key file (printf handles multi-line JSON safely)
          printf '%s' "${PLAY_SA_KEY}" > /tmp/android-play-sa.json

          # Validate it's valid JSON
          if command -v jq > /dev/null 2>&1; then
            if ! jq . /tmp/android-play-sa.json > /dev/null 2>&1; then
              echo "❌ ERROR: PLAY_SERVICE_ACCOUNT_KEY is not valid JSON"
              echo "   First 200 chars: $(head -c 200 /tmp/android-play-sa.json)"
              exit 1
            fi
            echo "✅ Service account key written & validated"
            echo "   Project: $(jq -r '.project_id' /tmp/android-play-sa.json)"
            echo "   Client email: $(jq -r '.client_email' /tmp/android-play-sa.json)"
          else
            echo "⚠️  jq not available, skipping JSON validation"
            echo "   File written: $(wc -c < /tmp/android-play-sa.json) bytes"
          fi

      - name: 🔍 Verify AAB exists
        if: ${{ needs.resolve-flavor.outputs.flavor == 'production' }}
        run: |
          ls -la android/app/build/outputs/bundle/productionRelease/app-production-release.aab

      - name: 🚀 Upload to Google Play Internal Testing
        if: ${{ needs.resolve-flavor.outputs.flavor == 'production' }}
        run: |
          node scripts/upload-android-play-store.mjs \
            --service-account-json /tmp/android-play-sa.json \
            --package-name com.tarsier.labs \
            --aab-path android/app/build/outputs/bundle/productionRelease/app-production-release.aab \
            --track internal \
            --status completed

  # ─────────────────────────────────────────────────────────────────────────────
  # Build iOS — Step 1: Build + Export IPA with proper code signing via Fastlane
  # ─────────────────────────────────────────────────────────────────────────────
  build-ios:
    name: Build iOS (${{ needs.resolve-flavor.outputs.flavor_label }})
    needs: [resolve-flavor, validate-env]
    runs-on: macos-latest
    timeout-minutes: 60
    environment: ${{ needs.resolve-flavor.outputs.flavor }}
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      TEAM_ID: ${{ secrets.TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack (Yarn Berry)
        run: |
          corepack enable
          echo "Yarn version: $(yarn --version)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        timeout-minutes: 10
        run: |
          yarn install --immutable --check-cache

      - name: Apply patches
        run: |
          echo "::group::Applying patches..."
          npx patch-package 2>&1 || { echo "::error::patch-package failed"; exit 1; }
          echo "::endgroup::"

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'yarn.lock') }}
          restore-keys: pods-${{ runner.os }}

      - name: Install Pods (clean + fresh install)
        timeout-minutes: 15
        run: |
          set -e
          echo "::group::Cleaning old Pods..."
          rm -rf ios/Pods
          echo "::endgroup::"

          echo "::group::Running pod install (verbose)..."
          cd ios && USE_FRAMEWORKS=static pod install --verbose 2>&1 || {
            echo "::error::pod install failed"
            cat Podfile.lock 2>/dev/null || true
            exit 1
          }
          cd ..
          echo "::endgroup::"

          echo "::group::Verifying Podfile.lock consistency..."
          if [ -f ios/Pods/Manifest.lock ]; then
            if ! diff -q ios/Podfile.lock ios/Pods/Manifest.lock >/dev/null 2>&1; then
              echo "::error::Podfile.lock and Manifest.lock differ — pod install may have issues"
              diff ios/Podfile.lock ios/Pods/Manifest.lock || true
              exit 1
            fi
            echo "::notice::Podfile.lock and Manifest.lock are consistent"
          else
            echo "::warning::Manifest.lock not found (Pods directory may be empty)"
          fi
          echo "::endgroup::"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: ios

      - name: Build Archive (Test config)
        if: ${{ needs.resolve-flavor.outputs.flavor == 'test' }}
        timeout-minutes: 30
        run: |
          echo "::group::Building iOS archive (staging)..."
          cd ios && bundle exec fastlane build_staging 2>&1 || { echo "::error::Fastlane build_staging failed"; exit 1; }
          echo "::endgroup::"

      - name: Build Archive (Production config)
        if: ${{ needs.resolve-flavor.outputs.flavor == 'production' }}
        timeout-minutes: 30
        run: |
          echo "::group::Building iOS archive (production)..."
          cd ios && bundle exec fastlane build_production 2>&1 || { echo "::error::Fastlane build_production failed"; exit 1; }
          echo "::endgroup::"

      - name: Verify IPA artifact
        run: |
          echo "::group::Verifying IPA artifact..."
          IPA_PATH=$(ls ios/build/*.ipa 2>/dev/null | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::No IPA file found in ios/build/"
            exit 1
          fi
          IPA_SIZE=$(stat -f%z "$IPA_PATH" 2>/dev/null || stat -c%s "$IPA_PATH" 2>/dev/null)
          echo "IPA: $IPA_PATH"
          echo "Size: $((IPA_SIZE / 1024 / 1024)) MB"
          if [ "$IPA_SIZE" -lt 1000000 ]; then
            echo "::error::IPA file suspiciously small: $IPA_SIZE bytes"
            exit 1
          fi
          echo "::notice::IPA artifact verified: $((IPA_SIZE / 1024 / 1024)) MB"
          echo "::endgroup::"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ needs.resolve-flavor.outputs.flavor }}-ipa
          path: ios/build/*.ipa
          retention-days: 7

      - name: Collect failure logs
        if: failure()
        continue-on-error: true
        run: |
          echo "::group::Collecting failure logs..."
          mkdir -p /tmp/failure-logs

          # yarn-error.log
          [ -f yarn-error.log ] && cp yarn-error.log /tmp/failure-logs/ || true

          # Fastlane/gym build logs
          find ~/Library/Logs/gym -name "*.log" -exec cp {} /tmp/failure-logs/ \; 2>/dev/null || true

          # Xcode DerivedData logs
          find ~/Library/Developer/Xcode/DerivedData -path "*/Logs/*.log" -exec cp {} /tmp/failure-logs/ \; 2>/dev/null || true

          # Podfile.lock + Manifest.lock for debugging
          [ -f ios/Podfile.lock ] && cp ios/Podfile.lock /tmp/failure-logs/ || true
          [ -f ios/Pods/Manifest.lock ] && cp ios/Pods/Manifest.lock /tmp/failure-logs/ || true

          ls -la /tmp/failure-logs/
          echo "::endgroup::"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-failure-logs-${{ github.run_id }}
          path: /tmp/failure-logs/
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy iOS to TestFlight — Step 2: Upload IPA (only if build succeeded)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-ios-testflight:
    name: Deploy iOS to TestFlight (${{ needs.resolve-flavor.outputs.flavor_label }})
    needs: [resolve-flavor, build-ios]
    if: ${{ !cancelled() && needs.build-ios.result == 'success' }}
    runs-on: macos-latest
    timeout-minutes: 30
    environment: ${{ needs.resolve-flavor.outputs.flavor }}
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: ios

      - name: Download IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-${{ needs.resolve-flavor.outputs.flavor }}-ipa
          path: ios/build

      - name: Upload to TestFlight
        timeout-minutes: 15
        run: |
          set -e
          echo "::group::Uploading IPA to TestFlight..."
          cd ios
          bundle exec fastlane run pilot upload \
            ipa:"./build/$(ls build/*.ipa | xargs basename)" \
            skip_waiting_for_build_processing:true 2>&1 || {
              echo "::error::TestFlight upload failed"
              exit 1
            }
          echo "::endgroup::"

  # ─────────────────────────────────────────────────────────────────────────────
  # CodePush (hot update) — only for test branch pushes
  # Uses self-hosted code-push-server at https://codepush.joyminis.com
  # ─────────────────────────────────────────────────────────────────────────────
  codepush-test:
    name: CodePush Test (Hot Update)
    needs: [resolve-flavor]
    if: ${{ needs.resolve-flavor.outputs.flavor == 'test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack (Yarn Berry)
        run: |
          corepack enable
          echo "Yarn version: $(yarn --version)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable --ignore-scripts

      - name: Apply patches
        run: npx patch-package

      - name: Install code-push-standalone CLI
        run: npm install -g code-push-standalone

      - name: Login to self-hosted CodePush
        run: |
          code-push-standalone login ${{ secrets.CODEPUSH_SERVER_URL }} \
            --accessKey "${{ secrets.CODEPUSH_ACCESS_KEY }}"

      - name: CodePush Staging (Android)
        run: |
          code-push-standalone release-react TarsierTest-android android \
            --deploymentName Staging \
            --description "CI: $(git log -1 --pretty=%s)"

      - name: CodePush Staging (iOS)
        run: |
          code-push-standalone release-react TarsierTest-ios ios \
            --deploymentName Staging \
            --description "CI: $(git log -1 --pretty=%s)" \
            --plistFile ios/FrontendBlogMobile/Info.plist \
            --xcodeProjectFile ios/FrontendBlogMobile.xcodeproj

  # ─────────────────────────────────────────────────────────────────────────────
  # CodePush (hot update) — hotfix branch → Production
  # Uses self-hosted code-push-server at https://codepush.joyminis.com
  # ─────────────────────────────────────────────────────────────────────────────
  codepush-production:
    name: CodePush Production (Hotfix)
    needs: [resolve-flavor]
    if: ${{ needs.resolve-flavor.outputs.flavor == 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack (Yarn Berry)
        run: |
          corepack enable
          echo "Yarn version: $(yarn --version)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable --ignore-scripts

      - name: Apply patches
        run: npx patch-package

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Install code-push-standalone CLI
        run: npm install -g code-push-standalone

      - name: Login to self-hosted CodePush
        run: |
          code-push-standalone login ${{ secrets.CODEPUSH_SERVER_URL }} \
            --accessKey "${{ secrets.CODEPUSH_ACCESS_KEY }}"

      - name: CodePush Production (Android)
        run: |
          code-push-standalone release-react Tarsier-android android \
            --deploymentName Production \
            --description "HOTFIX: $(git log -1 --pretty=%s)"

      - name: CodePush Production (iOS)
        run: |
          code-push-standalone release-react Tarsier-ios ios \
            --deploymentName Production \
            --description "HOTFIX: $(git log -1 --pretty=%s)" \
            --plistFile ios/FrontendBlogMobile/Info.plist \
            --xcodeProjectFile ios/FrontendBlogMobile.xcodeproj

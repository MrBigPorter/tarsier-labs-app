name: Deploy (Test / Production)

on:
  push:
    branches:
      - test
      - hotfix
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - production
  repository_dispatch:
    types: [codepush-hotfix, codepush-staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '17'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Decide which flavor to build based on trigger
  # ─────────────────────────────────────────────────────────────────────────────
  resolve-flavor:
    name: Resolve Flavor
    runs-on: ubuntu-latest
    outputs:
      flavor: ${{ steps.resolve.outputs.flavor }}
      flavor_label: ${{ steps.resolve.outputs.flavor_label }}

    steps:
      - name: Resolve environment
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FLAVOR="${{ github.event.inputs.environment }}"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            if [ "${{ github.event.action }}" = "codepush-hotfix" ]; then
              FLAVOR="production"
            elif [ "${{ github.event.action }}" = "codepush-staging" ]; then
              FLAVOR="test"
            else
              echo "❌ Unknown repository_dispatch action: ${{ github.event.action }}"
              exit 1
            fi
          elif [[ "${{ github.ref }}" == "refs/heads/test" ]]; then
            FLAVOR="test"
          elif [[ "${{ github.ref }}" == "refs/heads/hotfix" ]]; then
            FLAVOR="production"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            FLAVOR="production"
          else
            echo "❌ Unknown branch/tag — cannot resolve flavor"
            exit 1
          fi

          if [ "$FLAVOR" = "test" ]; then
            echo "flavor=test" >> $GITHUB_OUTPUT
            echo "flavor_label=Test" >> $GITHUB_OUTPUT
          else
            echo "flavor=production" >> $GITHUB_OUTPUT
            echo "flavor_label=Production" >> $GITHUB_OUTPUT
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Build Android
  # ─────────────────────────────────────────────────────────────────────────────
  build-android:
    name: Build Android (${{ needs.resolve-flavor.outputs.flavor_label }})
    needs: [resolve-flavor]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ needs.resolve-flavor.outputs.flavor }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install dependencies
        run: yarn install --immutable --ignore-scripts

      - name: Apply patches
        run: npx patch-package

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release-upload-key.keystore

      - name: Build Android (${{ needs.resolve-flavor.outputs.flavor_label }})
        run: |
          # Gradle signing properties are passed from GitHub Secrets via -P flags.
          # Set these in Settings → Secrets and variables → Actions:
          #   KEYSTORE_FILE, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
          # Also upload your .keystore file as a base64 secret or make it
          # available via the runner's filesystem (e.g. GitHub Actions cache).
          if [ "${{ needs.resolve-flavor.outputs.flavor }}" = "test" ]; then
            cd android && ./gradlew assembleStagingRelease --no-daemon \
              -PreactNativeArchitectures=arm64-v8a \
              -PKEYSTORE_FILE=${{ secrets.KEYSTORE_FILE }} \
              -PKEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} \
              -PKEY_ALIAS=${{ secrets.KEY_ALIAS }} \
              -PKEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          else
            cd android && ./gradlew bundleProductionRelease --no-daemon \
              -PreactNativeArchitectures=arm64-v8a \
              -PKEYSTORE_FILE=${{ secrets.KEYSTORE_FILE }} \
              -PKEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} \
              -PKEY_ALIAS=${{ secrets.KEY_ALIAS }} \
              -PKEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          fi

      - name: Upload APK/AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ needs.resolve-flavor.outputs.flavor }}
          path: |
            android/app/build/outputs/apk/staging/release/app-staging-release.apk
            android/app/build/outputs/bundle/productionRelease/app-production-release.aab
          retention-days: 30

      - name: 🔑 Write & validate Google Play service account key
        if: ${{ needs.resolve-flavor.outputs.flavor == 'production' }}
        env:
          PLAY_SA_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_KEY }}
        run: |
          # Validate secret is not empty
          if [ -z "${PLAY_SA_KEY}" ]; then
            echo "❌ ERROR: PLAY_SERVICE_ACCOUNT_KEY is empty or not configured."
            echo ""
            echo "   This secret must be set in GitHub repository secrets:"
            echo "   Settings → Secrets and variables → Actions → Repository secrets"
            echo "   Secret name: PLAY_SERVICE_ACCOUNT_KEY"
            echo "   Value: the full JSON content of your Google Play service account key"
            exit 1
          fi

          # Write the key file (printf handles multi-line JSON safely)
          printf '%s' "${PLAY_SA_KEY}" > /tmp/android-play-sa.json

          # Validate it's valid JSON
          if command -v jq > /dev/null 2>&1; then
            if ! jq . /tmp/android-play-sa.json > /dev/null 2>&1; then
              echo "❌ ERROR: PLAY_SERVICE_ACCOUNT_KEY is not valid JSON"
              echo "   First 200 chars: $(head -c 200 /tmp/android-play-sa.json)"
              exit 1
            fi
            echo "✅ Service account key written & validated"
            echo "   Project: $(jq -r '.project_id' /tmp/android-play-sa.json)"
            echo "   Client email: $(jq -r '.client_email' /tmp/android-play-sa.json)"
          else
            echo "⚠️  jq not available, skipping JSON validation"
            echo "   File written: $(wc -c < /tmp/android-play-sa.json) bytes"
          fi

      - name: 🔍 Verify AAB exists
        if: ${{ needs.resolve-flavor.outputs.flavor == 'production' }}
        run: |
          ls -la android/app/build/outputs/bundle/productionRelease/app-production-release.aab

      - name: 🚀 Upload to Google Play Internal Testing
        if: ${{ needs.resolve-flavor.outputs.flavor == 'production' }}
        run: |
          node scripts/upload-android-play-store.mjs \
            --service-account-json /tmp/android-play-sa.json \
            --package-name com.tarsier.labs \
            --aab-path android/app/build/outputs/bundle/productionRelease/app-production-release.aab \
            --track internal \
            --status completed

  # ─────────────────────────────────────────────────────────────────────────────
  # Build iOS — Step 1: Build + Export IPA with proper code signing via Fastlane
  # ─────────────────────────────────────────────────────────────────────────────
  build-ios:
    name: Build iOS (${{ needs.resolve-flavor.outputs.flavor_label }})
    needs: [resolve-flavor]
    runs-on: macos-latest
    timeout-minutes: 60
    environment: ${{ needs.resolve-flavor.outputs.flavor }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Apply patches
        run: npx patch-package

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'yarn.lock') }}
          restore-keys: pods-${{ runner.os }}

      - name: Clean Pods (force fresh install to avoid stale cache)
        run: rm -rf ios/Pods

      - name: Install Pods
        run: cd ios && USE_FRAMEWORKS=static pod install && cd ..

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: ios

      - name: Configure Code Signing & API Auth
        run: |
          echo "APP_STORE_CONNECT_KEY_ID=${{ secrets.APP_STORE_CONNECT_KEY_ID }}" >> $GITHUB_ENV
          echo "APP_STORE_CONNECT_ISSUER_ID=${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" >> $GITHUB_ENV
          echo "APP_STORE_CONNECT_KEY_CONTENT=${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}" >> $GITHUB_ENV
          echo "MATCH_PASSWORD=${{ secrets.MATCH_PASSWORD }}" >> $GITHUB_ENV
          echo "MATCH_GIT_BASIC_AUTHORIZATION=${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}" >> $GITHUB_ENV
          echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> $GITHUB_ENV
          echo "TEAM_ID=${{ secrets.TEAM_ID }}" >> $GITHUB_ENV

      - name: Build Archive (Test config)
        if: ${{ needs.resolve-flavor.outputs.flavor == 'test' }}
        run: cd ios && bundle exec fastlane build_staging

      - name: Build Archive (Production config)
        if: ${{ needs.resolve-flavor.outputs.flavor == 'production' }}
        run: cd ios && bundle exec fastlane build_production

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ needs.resolve-flavor.outputs.flavor }}-ipa
          path: ios/build/*.ipa
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy iOS to TestFlight — Step 2: Upload IPA (only if build succeeded)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-ios-testflight:
    name: Deploy iOS to TestFlight (${{ needs.resolve-flavor.outputs.flavor_label }})
    needs: [resolve-flavor, build-ios]
    if: ${{ !cancelled() && needs.build-ios.result == 'success' }}
    runs-on: macos-latest
    timeout-minutes: 30
    environment: ${{ needs.resolve-flavor.outputs.flavor }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: ios

      - name: Configure API Auth
        run: |
          echo "APP_STORE_CONNECT_KEY_ID=${{ secrets.APP_STORE_CONNECT_KEY_ID }}" >> $GITHUB_ENV
          echo "APP_STORE_CONNECT_ISSUER_ID=${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" >> $GITHUB_ENV
          echo "APP_STORE_CONNECT_KEY_CONTENT=${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}" >> $GITHUB_ENV

      - name: Download IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-${{ needs.resolve-flavor.outputs.flavor }}-ipa
          path: ios/build

      - name: Upload to TestFlight
        run: |
          cd ios
          bundle exec fastlane run pilot upload \
            ipa:"./build/$(ls build/*.ipa | xargs basename)" \
            skip_waiting_for_build_processing:true

  # ─────────────────────────────────────────────────────────────────────────────
  # CodePush (hot update) — only for test branch pushes
  # Uses self-hosted code-push-server at https://codepush.joyminis.com
  # ─────────────────────────────────────────────────────────────────────────────
  codepush-test:
    name: CodePush Test (Hot Update)
    needs: [resolve-flavor]
    if: ${{ needs.resolve-flavor.outputs.flavor == 'test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable --ignore-scripts

      - name: Apply patches
        run: npx patch-package

      - name: Install code-push-standalone CLI
        run: npm install -g code-push-standalone

      - name: Login to self-hosted CodePush
        run: |
          code-push-standalone login ${{ secrets.CODEPUSH_SERVER_URL }} \
            --accessKey "${{ secrets.CODEPUSH_ACCESS_KEY }}"

      - name: CodePush Staging (Android)
        run: |
          code-push-standalone release-react TarsierTest-android android \
            --deploymentName Staging \
            --description "CI: $(git log -1 --pretty=%s)"

      - name: CodePush Staging (iOS)
        run: |
          code-push-standalone release-react TarsierTest-ios ios \
            --deploymentName Staging \
            --description "CI: $(git log -1 --pretty=%s)" \
            --plistFile ios/FrontendBlogMobile/Info.plist \
            --xcodeProjectFile ios/FrontendBlogMobile.xcodeproj

  # ─────────────────────────────────────────────────────────────────────────────
  # CodePush (hot update) — hotfix branch → Production
  # Uses self-hosted code-push-server at https://codepush.joyminis.com
  # ─────────────────────────────────────────────────────────────────────────────
  codepush-production:
    name: CodePush Production (Hotfix)
    needs: [resolve-flavor]
    if: ${{ needs.resolve-flavor.outputs.flavor == 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable --ignore-scripts

      - name: Apply patches
        run: npx patch-package

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Install code-push-standalone CLI
        run: npm install -g code-push-standalone

      - name: Login to self-hosted CodePush
        run: |
          code-push-standalone login ${{ secrets.CODEPUSH_SERVER_URL }} \
            --accessKey "${{ secrets.CODEPUSH_ACCESS_KEY }}"

      - name: CodePush Production (Android)
        run: |
          code-push-standalone release-react Tarsier-android android \
            --deploymentName Production \
            --description "HOTFIX: $(git log -1 --pretty=%s)"

      - name: CodePush Production (iOS)
        run: |
          code-push-standalone release-react Tarsier-ios ios \
            --deploymentName Production \
            --description "HOTFIX: $(git log -1 --pretty=%s)" \
            --plistFile ios/FrontendBlogMobile/Info.plist \
            --xcodeProjectFile ios/FrontendBlogMobile.xcodeproj

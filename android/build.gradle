buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"

        // Pre-resolve react-native location so libraries (netinfo, reanimated, etc.)
        // can skip calling `node` during Gradle configuration.
        // This avoids "Cannot convert '' to File" errors when the Gradle daemon
        // doesn't properly inherit PATH for node (common with Volta/nvm on macOS).
        REACT_NATIVE_NODE_MODULES_DIR = "${projectDir}/../node_modules/react-native"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

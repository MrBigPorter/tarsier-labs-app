<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.06" />
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.03" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bg)" />

  <!-- Decorative circles -->
  <circle cx="850" cy="80" r="180" fill="#e94560" opacity="0.05" />
  <circle cx="900" cy="420" r="120" fill="#ff6b6b" opacity="0.04" />
  <circle cx="100" cy="400" r="100" fill="#533483" opacity="0.08" />

  <!-- Phone mockup frame -->
  <rect x="680" y="85" width="200" height="400" rx="28" ry="28" fill="#0d1117" stroke="#30363d" stroke-width="2" />
  <!-- Phone screen -->
  <rect x="688" y="93" width="184" height="384" rx="22" ry="22" fill="#161b22" />
  <!-- Status bar -->
  <rect x="688" y="93" width="184" height="30" rx="22" ry="22" fill="#1a1a2e" />
  <rect x="688" y="108" width="184" height="15" fill="#1a1a2e" />
  <!-- Notch -->
  <rect x="755" y="97" width="50" height="6" rx="3" ry="3" fill="#0d1117" />

  <!-- Phone content - article card -->
  <rect x="700" y="135" width="160" height="50" rx="6" fill="url(#card1)" />
  <rect x="710" y="145" width="60" height="6" rx="3" fill="#ffffff" opacity="0.4" />
  <rect x="710" y="158" width="90" height="4" rx="2" fill="#ffffff" opacity="0.2" />

  <rect x="700" y="195" width="160" height="70" rx="6" fill="url(#card1)" />
  <rect x="710" y="205" width="80" height="6" rx="3" fill="#ffffff" opacity="0.4" />
  <rect x="710" y="218" width="130" height="4" rx="2" fill="#ffffff" opacity="0.2" />
  <rect x="710" y="228" width="100" height="4" rx="2" fill="#ffffff" opacity="0.2" />
  <rect x="710" y="243" width="50" height="12" rx="4" fill="url(#accent)" opacity="0.6" />

  <rect x="700" y="275" width="160" height="70" rx="6" fill="url(#card1)" />
  <rect x="710" y="285" width="90" height="6" rx="3" fill="#ffffff" opacity="0.4" />
  <rect x="710" y="298" width="120" height="4" rx="2" fill="#ffffff" opacity="0.2" />
  <rect x="710" y="308" width="110" height="4" rx="2" fill="#ffffff" opacity="0.2" />
  <rect x="710" y="323" width="50" height="12" rx="4" fill="url(#accent)" opacity="0.6" />

  <!-- Bottom tab bar -->
  <rect x="688" y="450" width="184" height="27" rx="0" fill="#0d1117" opacity="0.9" />
  <rect x="688" y="460" width="184" height="17" rx="0" fill="#0d1117" />

  <!-- App name and tagline -->
  <text x="70" y="180" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="56" font-weight="bold" fill="#ffffff" letter-spacing="-1">Tarsier</text>

  <text x="72" y="220" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="18" fill="#8b949e" letter-spacing="0.3">
    <tspan x="72" dy="0">A sleek blog reader — browse, bookmark,</tspan>
    <tspan x="72" dy="24">and discover tech articles on the go</tspan>
  </text>

  <!-- Accent line -->
  <rect x="70" y="260" width="60" height="4" rx="2" fill="url(#accent)" />

  <!-- Feature badges -->
  <g transform="translate(70, 290)">
    <rect x="0" y="0" width="170" height="36" rx="18" fill="url(#card2)" stroke="#30363d" stroke-width="0.5" />
    <circle cx="20" cy="18" r="6" fill="#e94560" />
    <text x="34" y="23" font-family="-apple-system, sans-serif" font-size="13" fill="#c9d1d9">Multi-language</text>
  </g>
  <g transform="translate(250, 290)">
    <rect x="0" y="0" width="140" height="36" rx="18" fill="url(#card2)" stroke="#30363d" stroke-width="0.5" />
    <circle cx="20" cy="18" r="6" fill="#e94560" />
    <text x="34" y="23" font-family="-apple-system, sans-serif" font-size="13" fill="#c9d1d9">Dark mode</text>
  </g>
  <g transform="translate(70, 336)">
    <rect x="0" y="0" width="160" height="36" rx="18" fill="url(#card2)" stroke="#30363d" stroke-width="0.5" />
    <circle cx="20" cy="18" r="6" fill="#e94560" />
    <text x="34" y="23" font-family="-apple-system, sans-serif" font-size="13" fill="#c9d1d9">Bookmarks sync</text>
  </g>
  <g transform="translate(240, 336)">
    <rect x="0" y="0" width="170" height="36" rx="18" fill="url(#card2)" stroke="#30363d" stroke-width="0.5" />
    <circle cx="20" cy="18" r="6" fill="#e94560" />
    <text x="34" y="23" font-family="-apple-system, sans-serif" font-size="13" fill="#c9d1d9">CodePush OTA</text>
  </g>

  <!-- Google Play badge suggestion -->
  <g transform="translate(70, 400)">
    <rect x="0" y="0" width="200" height="50" rx="8" fill="#ffffff" opacity="0.06" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.1" />
    <text x="100" y="22" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Available on</text>
    <text x="100" y="40" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Google Play</text>
  </g>
</svg>
